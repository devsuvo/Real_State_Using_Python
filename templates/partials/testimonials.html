<section class="section section-testimonials">
  <div class="container">
    {% include "partials/section_heading.html" with eyebrow="Testimonials" title=site.testimonials_title subtitle=site.testimonials_subtitle light=True %}
    <div class="swiper testimonial-swiper">
      <div class="swiper-wrapper">
        {% for t in testimonials %}
        <div class="swiper-slide">
          <figure class="testimonial-card">
            <div class="stars" aria-label="{{ t.rating }} out of 5 stars">
              {% for i in "12345" %}<i class="bi {% if forloop.counter <= t.rating %}bi-star-fill{% else %}bi-star{% endif %}"></i>{% endfor %}
            </div>
            <blockquote>“{{ t.quote }}”</blockquote>
            <figcaption>
              {% if t.img %}<img src="{{ t.img }}{% if 'unsplash' in t.img %}&w=120&h=120&fit=crop&crop=faces&q=70{% endif %}" alt="" loading="lazy">{% endif %}
              <span><strong>{{ t.name }}</strong>{{ t.role }}</span>
            </figcaption>
            <i class="bi bi-quote quote-mark" aria-hidden="true"></i>
          </figure>
        </div>
        {% endfor %}
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </div>
</section>
