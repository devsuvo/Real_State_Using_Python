{% extends "dashboard/base.html" %}

{% block content %}
<div class="dash-head"><div><h1>Change password</h1><p>Use at least 8 characters, and avoid common words.</p></div></div>
<div class="row">
  <div class="col-lg-6">
    <form method="post" class="card-d" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <div class="{% if field.errors %}is-invalid-wrap{% endif %}">{{ field }}</div>
        {% for e in field.errors %}<div class="field-error">{{ e }}</div>{% endfor %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-dash"><i class="bi bi-key"></i>Update password</button>
    </form>
  </div>
</div>
{% endblock %}
